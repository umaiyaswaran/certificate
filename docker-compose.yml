services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
  backend:
    image: node:24-alpine
    working_dir: /app
    env_file: .env
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    command: sh -c "npm install --prefix backend && npm --prefix backend run start"